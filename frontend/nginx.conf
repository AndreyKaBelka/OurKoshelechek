server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS (127.0.0.11) + a variable in proxy_pass defers
    # resolving "app" to request time. A plain `proxy_pass http://app:8081`
    # resolves once at nginx startup and refuses to boot at all if the app
    # container isn't up yet (or is later replaced) — this keeps the
    # frontend serving static assets even while the backend is unavailable.
    resolver 127.0.0.11 valid=10s;

    location /query {
        set $upstream app:8081;
        proxy_pass http://$upstream/query;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|png|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
